<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- KUNCI FIX: interactive-widget=resizes-content akan membiarkan UI mengecil saat keyboard muncul, mencegah freeze -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Kasir Cafe</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00454f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">

  <style>
    /* HAPUS OVERFLOW HIDDEN - Biarkan browser mengatur scroll alaminya saat keyboard naik */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #00454f;
    }
    
    /* Gunakan 100dvh (Dynamic Viewport Height) agar Iframe menyesuaikan tinggi secara real-time saat keyboard muncul */
    #gas-frame {
      width: 100%;
      height: 100vh;
      height: 100dvh; 
      border: none;
      display: block;
      background-color: #00454f;
    }
  </style>
</head>
<body>

  <iframe 
    id="gas-frame" 
    src="https://script.google.com/macros/s/AKfycbzSMI5Hm8ttuevzpHjoYFCTm5eMqLBQiKqsPNY_4sko6sG6caBXGQ85GgNGXhs8Rbj8/exec"
    allow="autoplay; camera; microphone; geolocation">
  </iframe>

  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('SW v6 aktif'))
          .catch((err) => console.warn('SW issue:', err));
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #121212; overflow: hidden; font-family: sans-serif; }
    #setup { display: flex; height: 100%; align-items: center; justify-content: center; padding: 20px; }
    .box { background: #222; padding: 24px; border-radius: 10px; width: 100%; max-width: 400px; text-align: center; color: #fff; }
    input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #0d6efd; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; }
    iframe { width: 100%; height: 100%; border: none; display: none; }
    #gear { position: fixed; bottom: 10px; right: 10px; opacity: 0.3; background: #fff; border-radius: 50%; width: 30px; height: 30px; border: none; font-size: 14px; }
  </style>
</head>
<body>

  <div id="setup">
    <div class="box">
      <h3>Masukkan URL Web</h3>
      <input type="url" id="target-url" placeholder="https://...">
      <button onclick="launch()">Buka</button>
    </div>
  </div>

  <iframe id="frame" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals"></iframe>
  <button id="gear" onclick="resetUrl()">⚙</button>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const key = 'app_direct_url';
    const saved = localStorage.getItem(key);

    if (saved) {
      showFrame(saved);
    }

    function launch() {
      let url = document.getElementById('target-url').value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      localStorage.setItem(key, url);
      showFrame(url);
    }

    function showFrame(url) {
      document.getElementById('setup').style.display = 'none';
      const frame = document.getElementById('frame');
      frame.src = url;
      frame.style.display = 'block';
    }

    function resetUrl() {
      localStorage.removeItem(key);
      location.reload();
    }
  </script>
</body>
</html>

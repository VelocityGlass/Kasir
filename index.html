<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Desktop WebApp</title>
  
  <!-- Manifest PWA untuk instalasi di Chrome -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  
  <!-- Icon link (menggunakan direct thumbnail view dari ID Google Drive Anda) -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #ffffff;
    }

    /* Floating Quick Bar: Kontrol Print, Refresh, Fullscreen */
    #quick-bar {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 9999;
      opacity: 0.25;
      transition: opacity 0.3s ease;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    #quick-bar:hover {
      opacity: 1;
    }
    .tool-btn {
      background: #334155;
      color: #f8fafc;
      border: none;
      outline: none;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s, transform 0.1s;
    }
    .tool-btn:hover {
      background: #2563eb;
    }
    .tool-btn:active {
      transform: scale(0.95);
    }
    
    /* Loading overlay awal */
    #preloader {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      z-index: 9998;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="preloader">
    <div class="spinner"></div>
    <div style="font-weight: 600; font-size: 15px;">Memuat Aplikasi Desktop...</div>
    <div style="font-size: 12px; color: #94a3b8; margin-top: 6px;">Menghubungkan ke Google Apps Script</div>
  </div>

  <!-- 
    Iframe dengan atribut izin lengkap untuk:
    - camera & microphone (akses scanner/kamera)
    - display-capture & fullscreen
    - clipboard & printing
  -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxu2Wy_9pVuM2iWZFAbzIYZU3M8KlX4d3XTtuWjMWE97QRNh_jn6EHPl8hPOoB6DeU-/exec"
    allow="camera; microphone; geolocation; fullscreen; display-capture; clipboard-read; clipboard-write; web-share"
    allowfullscreen>
  </iframe>

  <!-- Quick Floating Tools untuk kemudahan operasional di desktop -->
  <div id="quick-bar">
    <button class="tool-btn" onclick="triggerPrint()" title="Cetak / Print Halaman">🖨️ Cetak</button>
    <button class="tool-btn" onclick="toggleFullscreen()" title="Layar Penuh">⛶ Fullscreen</button>
    <button class="tool-btn" onclick="reloadFrame()" title="Segarkan WebApp">🔄 Muat Ulang</button>
  </div>

  <script>
    // 1. Hilangkan Preloader saat iframe selesai dimuat
    const frame = document.getElementById('app-frame');
    const preloader = document.getElementById('preloader');

    frame.onload = () => {
      preloader.classList.add('hidden');
    };

    // Timeout pengaman jika load lambat
    setTimeout(() => {
      preloader.classList.add('hidden');
    }, 4500);

    // 2. Fungsi Cetak / Print langsung ke iframe
    function triggerPrint() {
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } catch (err) {
        // Jika cross-origin print terhalang, panggil window print induk
        window.print();
      }
    }

    // 3. Fungsi Toggle Layar Penuh (True Fullscreen)
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(e => console.log(e));
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 4. Reload Iframe
    function reloadFrame() {
      preloader.classList.remove('hidden');
      frame.src = frame.src;
    }

    // 5. Registrasi Service Worker PWA agar tombol install Chrome muncul
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker terdaftar:', reg.scope))
          .catch(err => console.log('Gagal daftar SW:', err));
      });
    }

    // 6. Dengarkan event tombol instalasi Chrome (opsional auto prompt)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('Aplikasi siap di-install di Chrome!');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velocity Kasir</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo-box {
      width: 90px;
      height: 90px;
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .logo-box svg {
      width: 50px;
      height: 50px;
      fill: #0d6efd;
    }
    h1 { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
    p { font-size: 14px; color: #888; margin-bottom: 25px; max-width: 300px; line-height: 1.4; }
    
    .btn {
      display: block;
      width: 100%;
      max-width: 280px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin-bottom: 12px;
    }
    .btn-install {
      background-color: #28a745;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
    }
    .btn-open {
      background-color: #0d6efd;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(13, 110, 253, 0.4);
    }
    #status-msg {
      font-size: 12px;
      color: #ffc107;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Logo SVG bawaan agar tidak pernah broken -->
  <div class="logo-box">
    <svg viewBox="0 0 24 24">
      <path d="M19 14V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zm-2 0H3V6h14v8zm4-7v11c0 1.1-.9 2-2 2H4v-2h15V7h2zM7 10h4v2H7v-2z"/>
    </svg>
  </div>

  <h1>Velocity Kasir</h1>
  <p>Aplikasi Kasir POS Clean Mode</p>

  <!-- Tombol Pasang Aplikasi Langsung -->
  <button id="btn-install" class="btn btn-install" onclick="triggerInstall()">📲 Pasang Aplikasi (Instal)</button>
  
  <!-- Tombol Buka WebApp -->
  <a class="btn btn-open" href="https://script.google.com/macros/s/AKfycbxWifql7ClYcw9s2Yxbq7kQOeoJm2wDMrWFwZedTTrl-vW11vm0RE8M11p1kKu8oAjt/exec" target="_blank">🚀 Buka WebApp Kasir</a>

  <div id="status-msg"></div>

  <script>
    let deferredPrompt = null;
    const btnInstall = document.getElementById('btn-install');
    const statusMsg = document.getElementById('status-msg');

    // Daftarkan Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(() => {
        console.log('SW Registered');
      }).catch(err => {
        statusMsg.innerText = 'Service Worker error: ' + err;
      });
    }

    // Dengarkan event dari Chrome
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      statusMsg.innerText = 'Aplikasi siap dipasang!';
    });

    async function triggerInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          statusMsg.innerText = 'Aplikasi berhasil dipasang!';
        }
        deferredPrompt = null;
      } else {
        // Jika browser belum trigger prompt otomatis
        alert("Tekan titik tiga (⋮) di pojok kanan atas Chrome, lalu pilih 'Instal aplikasi' atau 'Tambahkan ke Layar Utama'.");
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Kunci viewport: Skala tetap 1.0, minimum 1.0, maksimum 1.0, user-scalable=no -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>Velocity Kasir</title>

  <!-- Konfigurasi PWA & Layar Penuh -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Velocity Kasir">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      /* Mencegah gesture zoom bawaan peramban */
      touch-action: pan-x pan-y;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed; /* Mencegah scroll overscroll/bounce yang memicu zoom */
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background-color: #0f172a;
      touch-action: pan-x pan-y;
    }

    /* Loading Screen Animasi Halus */
    #loader {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    .loader-text {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #cbd5e1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Layar Pembuka / Loading -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Memuat Velocity Kasir...</div>
  </div>

  <!-- Iframe Aplikasi Google Apps Script -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxKlUnTTVgB98_33wBQpX6oHPpQOio9CFo42kDY19sUK3bMCU6R0N6kCmoWizeipeyQ/exec" 
    allow="camera; microphone; geolocation; fullscreen; payment; clipboard-read; clipboard-write"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(() => loader.remove(), 400);
      }
    }

    // Fallback loader jika jaringan lambat
    setTimeout(hideLoader, 6000);

    // 1. Blokir Pinch-to-Zoom (Sentuhan lebih dari 1 jari)
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // 2. Blokir Gestur Skala (iOS Safari & Chrome Touch)
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function (e) {
      e.preventDefault();
    });

    // 3. Blokir Double-Tap Zoom (Ketukan dua kali beruntun)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    // 4. Blokir Ctrl + Scroll Wheel (Zoom via mouse/trackpad)
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey) {
        e.preventDefault();
      }
    }, { passive: false });

    // Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Velocity Kasir Aktif:', reg.scope))
          .catch(err => console.error('SW Registrasi Gagal:', err));
      });
    }
  </script>
</body>
</html>

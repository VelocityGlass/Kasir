<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart POS - Point of Sale Resto</title>

  <!-- PWA Meta Settings -->
  <meta name="theme-color" content="#00454f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart POS">
  <meta name="application-name" content="Smart POS">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="https://placehold.co/192x192/00454f/ffffff.png?text=POS">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/00454f/ffffff.png?text=POS">

  <!-- Manifest Dinamis -->
  <link id="pwaManifest" rel="manifest">

  <style>
    /* CSS Reset */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      height: 100%;
      background-color: #00454f;
    }

    body {
      width: 100%;
      height: 100%;
      background-color: #00454f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    /* Container Luar Penyerap Resolusi HP */
    #viewportScroller {
      width: 100%;
      min-height: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      background-color: #00454f;
      overflow: hidden;
    }

    /* Stage Kanvas Desktop Tetap 1280px */
    #desktopCanvas {
      width: 1280px;
      height: 800px;
      transform-origin: 0 0;
      -webkit-transform-origin: 0 0;
      flex-shrink: 0;
      pointer-events: auto !important;
    }

    /* Iframe Aplikasi POS */
    #posFrame {
      width: 1280px;
      height: 800px;
      border: 0;
      display: block;
      background-color: #00454f;
      pointer-events: auto !important;
    }

    /* Banner Install PWA */
    #installBanner {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      z-index: 9999999;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    #installBanner button.btn-install {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
    }

    #installBanner button.btn-close-banner {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <div id="viewportScroller">
    <div id="desktopCanvas">
      <iframe 
        id="posFrame" 
        src="https://script.google.com/macros/s/AKfycbywNTldf5Y2rwR8CLkDeCcywI7I_d2Jv2YZKdTW_1o070JFQ5nF_tu0nph6O9VwLbiG/exec"
        allow="camera; microphone; payment; geolocation; autoplay; clipboard-read; clipboard-write; fullscreen"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation allow-pointer-lock"
      ></iframe>
    </div>
  </div>

  <!-- Banner Install PWA -->
  <div id="installBanner">
    <span style="font-size: 0.82rem; font-weight: 600;">Instal Smart POS di HP?</span>
    <button class="btn-install" onclick="executeInstallPrompt()">Instal</button>
    <button class="btn-close-banner" onclick="dismissInstallBanner()">&times;</button>
  </div>

  <script>
    // 1. Inisialisasi Manifest PWA
    (function initManifest() {
      const manifest = {
        name: "Smart POS Kasir & Resto",
        short_name: "Smart POS",
        description: "Sistem Point of Sales Kasir Restoran",
        start_url: "./index.html",
        scope: "./",
        display: "standalone",
        orientation: "any",
        background_color: "#00454f",
        theme_color: "#00454f",
        icons: [
          {
            src: "https://placehold.co/192x192/00454f/ffffff.png?text=POS",
            sizes: "192x192",
            type: "image/png",
            purpose: "any maskable"
          },
          {
            src: "https://placehold.co/512x512/00454f/ffffff.png?text=POS+PRO",
            sizes: "512x512",
            type: "image/png",
            purpose: "any maskable"
          }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      document.getElementById("pwaManifest").setAttribute("href", URL.createObjectURL(blob));
    })();

    // 2. Mesin Auto-Fit Scale Desktop (Stabil terhadap Keyboard Android)
    const TARGET_DESKTOP_WIDTH = 1280;
    const canvas = document.getElementById("desktopCanvas");
    const scroller = document.getElementById("viewportScroller");
    let currentScale = 1;

    function applyDesktopScale() {
      if (!canvas) return;

      // Ambil lebar viewport sebenarnya
      const screenWidth = Math.min(window.innerWidth || document.documentElement.clientWidth || screen.width, screen.width);
      
      // Hitung skala otomatis agar 1280px muat sempurna di layar HP
      currentScale = screenWidth / TARGET_DESKTOP_WIDTH;

      canvas.style.transform = `scale(${currentScale})`;
      canvas.style.webkitTransform = `scale(${currentScale})`;

      // Sesuaikan tinggi container pembungkus agar scroll lancar
      if (scroller) {
        scroller.style.width = `${screenWidth}px`;
        scroller.style.height = `${800 * currentScale}px`;
      }
    }

    // Jalankan skala hanya saat inisialisasi & rotasi orientasi
    window.addEventListener("DOMContentLoaded", applyDesktopScale);
    window.addEventListener("orientationchange", () => {
      setTimeout(applyDesktopScale, 250);
    });

    let lastKnownOrientation = window.orientation;
    window.addEventListener("resize", () => {
      // Hanya hitung ulang jika orientasi berubah, cegah kalkulasi ulang saat keyboard virtual Android muncul
      if (window.orientation !== lastKnownOrientation) {
        lastKnownOrientation = window.orientation;
        setTimeout(applyDesktopScale, 250);
      }
    });

    applyDesktopScale();

    // 3. Kunci Total Zoom-In (Blokir Double-Tap Zoom & Multi-Touch Pinch)
    document.addEventListener('touchstart', function(e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    let lastTouchTime = 0;
    document.addEventListener('touchend', function(e) {
      const currentTime = Date.now();
      if (currentTime - lastTouchTime <= 300) {
        e.preventDefault();
      }
      lastTouchTime = currentTime;
    }, false);

    // 4. Service Worker PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const swScript = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => self.clients.claim());
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swScript], { type: "application/javascript" });
        navigator.serviceWorker.register(URL.createObjectURL(blob))
          .catch((err) => console.warn("PWA SW:", err));
      });
    }

    // 5. Banner PWA Install
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById("installBanner");
      if (banner) banner.style.display = "flex";
    });

    function executeInstallPrompt() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          dismissInstallBanner();
        });
      }
    }

    function dismissInstallBanner() {
      const banner = document.getElementById("installBanner");
      if (banner) banner.style.display = "none";
    }

    window.addEventListener("appinstalled", dismissInstallBanner);
  </script>
</body>
</html>

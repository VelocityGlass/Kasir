<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir Cafe</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00454f">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #00454f;
      /* Mencegah efek pull-to-refresh Android yang bikin layar nyangkut */
      overscroll-behavior-y: none; 
    }

    .scroll-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      /* KUNCI FIX 100%: Memaksa HP menggunakan GPU agar iframe Google tidak nge-hang saat disentuh */
      transform: translateZ(0); 
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="scroll-wrapper">
    <iframe 
      id="gas-frame" 
      src="https://script.google.com/macros/s/AKfycbzSMI5Hm8ttuevzpHjoYFCTm5eMqLBQiKqsPNY_4sko6sG6caBXGQ85GgNGXhs8Rbj8/exec"
      allow="autoplay; camera; microphone; geolocation; clipboard-read; clipboard-write"
      scrolling="yes">
    </iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Desktop WebApp</title>
  
  <!-- Manifest PWA untuk instalasi di Chrome -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Icon link (ID Google Drive Anda) -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #ffffff;
    }
    
    /* Loading overlay awal */
    #preloader {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      z-index: 9998;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="preloader">
    <div class="spinner"></div>
    <div style="font-weight: 600; font-size: 15px;">Memuat Aplikasi Desktop...</div>
    <div style="font-size: 12px; color: #94a3b8; margin-top: 6px;">Menghubungkan ke Google Apps Script</div>
  </div>

  <!-- 
    Iframe dengan atribut izin lengkap untuk:
    - camera & microphone (kamera scanner barcode/webcam)
    - geolocation & fullscreen
    - clipboard & display capture
  -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxu2Wy_9pVuM2iWZFAbzIYZU3M8KlX4d3XTtuWjMWE97QRNh_jn6EHPl8hPOoB6DeU-/exec"
    allow="camera; microphone; geolocation; fullscreen; display-capture; clipboard-read; clipboard-write; web-share"
    allowfullscreen>
  </iframe>

  <script>
    // 1. Hilangkan Preloader saat iframe selesai dimuat
    const frame = document.getElementById('app-frame');
    const preloader = document.getElementById('preloader');

    frame.onload = () => {
      preloader.classList.add('hidden');
    };

    // Timeout pengaman jika koneksi lambat
    setTimeout(() => {
      preloader.classList.add('hidden');
    }, 4500);

    // 2. Registrasi Service Worker PWA agar fitur install Desktop Chrome aktif
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker terdaftar:', reg.scope))
          .catch(err => console.log('Gagal daftar SW:', err));
      });
    }

    // 3. Listener instalasi Chrome
    window.addEventListener('beforeinstallprompt', (e) => {
      // Izinkan browser menampilkan prompt install standar
      console.log('Aplikasi siap di-install di Chrome!');
    });
  </script>
</body>
</html>

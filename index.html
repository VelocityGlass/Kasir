<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velocity Kasir</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="icon-512.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      object-fit: contain;
      background: #fff;
      padding: 8px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; font-weight: bold; }
    p { font-size: 14px; color: #aaa; margin-bottom: 30px; max-width: 320px; line-height: 1.5; }
    
    .btn {
      display: block;
      width: 100%;
      max-width: 280px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin-bottom: 12px;
    }
    .btn-install {
      background-color: #28a745;
      color: #fff;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.35);
    }
    .btn-open {
      background-color: #0d6efd;
      color: #fff;
      box-shadow: 0 4px 15px rgba(13, 110, 253, 0.35);
    }
  </style>
</head>
<body>

  <img src="icon-512.png" alt="Logo" class="logo">
  <h1>Velocity Kasir</h1>
  <p>Instal aplikasi ini ke layar utama HP Anda untuk akses cepat dan clean.</p>

  <!-- Tombol Instal Otomatis PWA -->
  <button id="btn-install" class="btn btn-install" style="display: none;">📲 Instal Aplikasi Sekarang</button>
  
  <!-- Tombol Buka Langsung -->
  <a id="btn-open" class="btn btn-open" href="https://script.google.com/macros/s/AKfycbxWifql7ClYcw9s2Yxbq7kQOeoJm2wDMrWFwZedTTrl-vW11vm0RE8M11p1kKu8oAjt/exec" target="_blank">🚀 Buka WebApp Kasir</a>

  <script>
    // Registrasi Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // Tangkap event PWA install prompt dari Chrome
    let deferredPrompt;
    const installBtn = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Viewport tetap 1.0, kunci zoom untuk pengalaman aplikasi native -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>Velocity Kasir</title>

  <!-- 
    Favicon & Apple Touch Icon dengan margin aman (safe-zone 15%)
    Menggunakan gambar logo asli Google Drive (ID: 1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno) 
    yang dibungkus dalam kanvas SVG putih agar logo & tulisan tidak pernah terpotong.
  -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23ffffff'/%3E%3Cimage href='https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno' x='40' y='40' width='432' height='432' preserveAspectRatio='xMidYMid meet'/%3E%3C/svg%3E">

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23ffffff'/%3E%3Cimage href='https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno' x='40' y='40' width='432' height='432' preserveAspectRatio='xMidYMid meet'/%3E%3C/svg%3E">

  <!-- 
    Web App Manifest Inline (Data URI)
    Mengunci Chrome Android agar langsung mengambil logo Velocity ber-padding aman 
    dan TIDAK beralih ke favicon default orang berdasi bawaan Google Script!
  -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Velocity%20Kasir%22%2C%22short_name%22%3A%22Velocity%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2300454f%22%2C%22theme_color%22%3A%22%2300454f%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20512%20512'%253E%253Crect%20width%3D'512'%20height%3D'512'%20rx%3D'110'%20fill%3D'%2523ffffff'%2F%253E%253Cimage%20href%3D'https%3A%2F%2Flh3.googleusercontent.com%2Fd%2F1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno'%20x%3D'40'%20y%3D'40'%20width%3D'432'%20height%3D'432'%20preserveAspectRatio%3D'xMidYMid%20meet'%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%2C%7B%22src%22%3A%22https%3A%2F%2Flh3.googleusercontent.com%2Fd%2F1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%22%7D%5D%7D">

  <!-- Konfigurasi Tema UI Browser -->
  <meta name="theme-color" content="#00454f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Velocity Kasir">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x pan-y;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background-color: #00454f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background-color: #00454f;
      touch-action: pan-x pan-y;
    }

    /* Layar Splash Elegan dengan transisi halus */
    #loader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #005a67 0%, #00454f 65%, #002b31 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 24px;
    }

    /* Wadah Logo: Diberi margin dan padding proporsional agar gambar tidak terpotong */
    .logo-badge {
      width: 150px;
      height: 150px;
      background: #ffffff;
      border-radius: 36px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.2);
      margin-bottom: 24px;
      animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 12px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 255, 255, 0.18);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    .loader-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .loader-subtitle {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2px;
      color: #94d2bd;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="logo-badge">
      <img 
        src="https://drive.google.com/thumbnail?id=1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno&sz=w512" 
        alt="Velocity Glass Logo" 
        class="logo-img"
        onerror="this.onerror=null; this.src='https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno';">
    </div>
    <div class="spinner"></div>
    <div class="loader-title">Velocity Kasir</div>
    <div class="loader-subtitle">Menyiapkan sistem transaksi...</div>
  </div>

  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxKlUnTTVgB98_33wBQpX6oHPpQOio9CFo42kDY19sUK3bMCU6R0N6kCmoWizeipeyQ/exec" 
    allow="camera; microphone; geolocation; fullscreen; payment; clipboard-read; clipboard-write"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(() => loader.remove(), 400);
      }
    }

    // Batas waktu maksimal loader 6 detik
    setTimeout(hideLoader, 6000);

    // 1. Blokir multi-touch zoom
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // 2. Blokir gestur zoom bawaan iOS
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); });

    // 3. Blokir double tap zoom
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    // 4. Blokir zoom roda mouse / touchpad
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey) e.preventDefault();
    }, { passive: false });

    // 5. Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.log('SW Note:', err));
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>Smart POS Resto</title>

  <!-- PWA Meta Settings -->
  <meta name="theme-color" content="#00454f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart POS">
  <meta name="application-name" content="Smart POS">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="https://placehold.co/192x192/00454f/ffffff.png?text=POS">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/00454f/ffffff.png?text=POS">

  <!-- Dynamic Web App Manifest Injection -->
  <link id="pwaManifest" rel="manifest">

  <style>
    /* Reset & Kunci Total Zoom / Gestur Layar */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden !important;
      position: fixed;
      inset: 0;
      background-color: #00454f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: none !important; /* Mencegah pinch-to-zoom bawaan browser */
    }

    /* Container Desktop Viewport */
    #viewportWrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #00454f;
    }

    /* Target Layar Desktop Standar (1280x800) yang akan di-scaling proporsional otomatis */
    #desktopScaleContainer {
      position: absolute;
      width: 1280px;
      height: 800px;
      transform-origin: center center;
      background-color: #00454f;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      pointer-events: auto !important;
      touch-action: auto !important;
    }

    #appFrame {
      width: 1280px;
      height: 800px;
      border: none;
      display: block;
      background-color: #00454f;
      pointer-events: auto !important;
    }

    /* Floating PWA Install Bar */
    #installBanner {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      z-index: 999999;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: slideUp 0.3s ease-out;
      user-select: none;
      -webkit-user-select: none;
    }

    @keyframes slideUp {
      from { transform: translate(-50%, 50px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    #installBanner button.btn-install {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 7px 16px;
      border-radius: 9999px;
      cursor: pointer;
    }

    #installBanner button.btn-close-banner {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Viewport Wrapper Utama dengan Auto-Fit Matrix Scale -->
  <div id="viewportWrapper">
    <div id="desktopScaleContainer">
      <iframe 
        id="appFrame" 
        src="https://script.google.com/macros/s/AKfycbxufv8OlwdRpIA9kGwJKR0o0DvzfOMOPJGj6zzfh5pDYQrojP3_y0qvu1NvhLPDK0QQ/exec"
        allow="camera; microphone; payment; geolocation; autoplay; clipboard-read; clipboard-write; fullscreen"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation allow-pointer-lock"
      ></iframe>
    </div>
  </div>

  <!-- Prompt Install Melayang -->
  <div id="installBanner">
    <span style="font-size: 0.82rem; font-weight: 600;">Instal Smart POS di HP?</span>
    <button class="btn-install" onclick="executeInstallPrompt()">Instal</button>
    <button class="btn-close-banner" onclick="dismissInstallBanner()">&times;</button>
  </div>

  <script>
    // 1. Inisialisasi Manifest PWA
    (function initManifest() {
      const manifest = {
        name: "Smart POS Kasir & Resto",
        short_name: "Smart POS",
        description: "Aplikasi Kasir Point of Sales Restoran & Kitchen",
        start_url: "./index.html",
        scope: "./",
        display: "standalone",
        orientation: "any",
        background_color: "#00454f",
        theme_color: "#00454f",
        icons: [
          {
            src: "https://placehold.co/192x192/00454f/ffffff.png?text=POS",
            sizes: "192x192",
            type: "image/png",
            purpose: "any maskable"
          },
          {
            src: "https://placehold.co/512x512/00454f/ffffff.png?text=POS+PRO",
            sizes: "512x512",
            type: "image/png",
            purpose: "any maskable"
          }
        ]
      };

      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      const manifestUrl = URL.createObjectURL(blob);
      document.getElementById("pwaManifest").setAttribute("href", manifestUrl);
    })();

    // 2. Mesin Auto Zoom-Out Total Desktop Fitting
    const BASE_WIDTH = 1280;
    const BASE_HEIGHT = 800;

    function applyDesktopAutoFitScale() {
      const container = document.getElementById("desktopScaleContainer");
      if (!container) return;

      const windowW = window.innerWidth || document.documentElement.clientWidth || screen.width;
      const windowH = window.innerHeight || document.documentElement.clientHeight || screen.height;

      // Hitung skala rasio agar 1280x800 muat 100% tanpa ada yang terpotong dan tanpa scrollbar
      const scaleX = windowW / BASE_WIDTH;
      const scaleY = windowH / BASE_HEIGHT;
      const finalScale = Math.min(scaleX, scaleY);

      container.style.transform = `scale(${finalScale})`;
      container.style.webkitTransform = `scale(${finalScale})`;
    }

    // Jalankan auto-scaling saat load, resize, dan pergantian orientasi layar
    window.addEventListener("resize", applyDesktopAutoFitScale);
    window.addEventListener("orientationchange", () => {
      setTimeout(applyDesktopAutoFitScale, 150);
    });
    window.addEventListener("DOMContentLoaded", applyDesktopAutoFitScale);
    applyDesktopAutoFitScale();

    // 3. Kunci Total Zoom-In (Mencegah pinch gesture di HP agar tidak freeze)
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    }, { passive: false });

    // Mencegah double tap zoom di browser mobile
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    // 4. Service Worker Inline PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const swScript = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => self.clients.claim());
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swScript], { type: "application/javascript" });
        const swUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(swUrl)
          .then(() => console.log("PWA SW Aktif"))
          .catch((err) => console.warn("PWA SW Info:", err));
      });
    }

    // 5. PWA Install Prompt Listener
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById("installBanner");
      if (banner) banner.style.display = "flex";
    });

    function executeInstallPrompt() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          dismissInstallBanner();
        });
      }
    }

    function dismissInstallBanner() {
      const banner = document.getElementById("installBanner");
      if (banner) banner.style.display = "none";
    }

    window.addEventListener("appinstalled", () => {
      dismissInstallBanner();
    });
  </script>
</body>
</html>

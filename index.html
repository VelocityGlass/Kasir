<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Memaksa browser HP membuka dalam mode desktop (lebar virtual 1280px) -->
  <meta name="viewport" content="width=1280, initial-scale=0.3, maximum-scale=2.0, user-scalable=yes">
  <title>App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Masukkan link tujuan Anda pada atribut src di bawah -->
  <iframe 
    src="https://example.com" 
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen>
  </iframe>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir Cafe</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00454f">
  
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #00454f;
      overflow: hidden; /* Mencegah layar utama scroll, biarkan iframe yang scroll */
    }
    
    /* Iframe absolut memeluk layar */
    #gas-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #00454f;
    }
  </style>
</head>
<body>

  <iframe 
    id="gas-frame" 
    src="https://script.google.com/macros/s/AKfycbzSMI5Hm8ttuevzpHjoYFCTm5eMqLBQiKqsPNY_4sko6sG6caBXGQ85GgNGXhs8Rbj8/exec" 
    allow="geolocation; microphone; camera; autoplay">
  </iframe>

  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('SW v5 aktif'))
          .catch((err) => console.warn('SW issue:', err));
      });
    }
  </script>
</body>
</html>

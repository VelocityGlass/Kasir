<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart POS Resto</title>

  <!-- PWA Meta Settings -->
  <meta name="theme-color" content="#00454f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart POS">
  <meta name="application-name" content="Smart POS">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="https://placehold.co/192x192/00454f/ffffff.png?text=POS">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/00454f/ffffff.png?text=POS">

  <!-- Dynamic Web App Manifest Injection -->
  <link id="pwaManifest" rel="manifest">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #00454f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #f8fafc;
    }

    /* Floating PWA Install Bar */
    #installBanner {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      z-index: 99999;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translate(-50%, 50px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    #installBanner button.btn-install {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 7px 16px;
      border-radius: 9999px;
      cursor: pointer;
    }

    #installBanner button.btn-close-banner {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Target URL WebApp GAS Anda yang sudah diperbarui -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbxNaDynLvhIEX7FfSR_5GVWhUmiwyWuk3-vB3Z8eGzUzpfVdla6yIRv8gyig88xo9jf/exec"
    allow="camera; microphone; payment; geolocation; autoplay; clipboard-read; clipboard-write; fullscreen"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
  ></iframe>

  <!-- Prompt Install Melayang -->
  <div id="installBanner">
    <span style="font-size: 0.82rem; font-weight: 600;">Instal Smart POS di HP?</span>
    <button class="btn-install" onclick="executeInstallPrompt()">Instal</button>
    <button class="btn-close-banner" onclick="dismissInstallBanner()">&times;</button>
  </div>

  <script>
    // 1. Buat Web App Manifest secara dinamis via Blob URL
    (function initManifest() {
      const manifest = {
        name: "Smart POS Kasir & Resto",
        short_name: "Smart POS",
        description: "Aplikasi Kasir Point of Sales Restoran & Kitchen",
        start_url: window.location.href,
        scope: window.location.href,
        display: "standalone",
        orientation: "landscape",
        background_color: "#00454f",
        theme_color: "#00454f",
        icons: [
          {
            src: "https://placehold.co/192x192/00454f/ffffff.png?text=POS",
            sizes: "192x192",
            type: "image/png",
            purpose: "any maskable"
          },
          {
            src: "https://placehold.co/512x512/00454f/ffffff.png?text=POS+PRO",
            sizes: "512x512",
            type: "image/png",
            purpose: "any maskable"
          }
        ]
      };

      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      const manifestUrl = URL.createObjectURL(blob);
      document.getElementById("pwaManifest").setAttribute("href", manifestUrl);
    })();

    // 2. Daftarkan Service Worker via Blob (Memenuhi syarat PWA Chrome)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const swScript = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => self.clients.claim());
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swScript], { type: "application/javascript" });
        const swUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(swUrl)
          .then((reg) => console.log("PWA Service Worker Aktif:", reg.scope))
          .catch((err) => console.warn("PWA Service Worker Warning:", err));
      });
    }

    // 3. Tangkap Event Chrome "beforeinstallprompt"
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById("installBanner");
      if (banner) {
        banner.style.display = "flex";
      }
    });

    function executeInstallPrompt() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === "accepted") {
            console.log("Pengguna menyetujui instalasi PWA");
          }
          deferredPrompt = null;
          dismissInstallBanner();
        });
      }
    }

    function dismissInstallBanner() {
      const banner = document.getElementById("installBanner");
      if (banner) banner.style.display = "none";
    }

    window.addEventListener("appinstalled", () => {
      console.log("Smart POS berhasil terpasang di perangkat");
      dismissInstallBanner();
    });
  </script>
</body>
</html>

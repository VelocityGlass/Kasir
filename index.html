<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Kunci viewport: Skala tetap 1.0, anti-zoom untuk nuansa aplikasi native -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>Velocity Kasir</title>

  <!-- Warna Tema & Status Bar disesuaikan ke #00454f -->
  <meta name="theme-color" content="#00454f">
  <meta name="msapplication-navbutton-color" content="#00454f">
  <meta name="apple-mobile-web-app-status-bar-style" content="#00454f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Velocity Kasir">

  <!-- Direct URL thumbnail Google Drive untuk logo aplikasi -->
  <link rel="icon" type="image/png" sizes="192x192" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">

  <!-- Manifest PWA disematkan langsung (Data URI) agar ikon Chrome terpasang otomatis -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Velocity Kasir",
    "short_name": "Velocity",
    "start_url": "./",
    "display": "standalone",
    "orientation": "any",
    "background_color": "#00454f",
    "theme_color": "#00454f",
    "icons": [
      {
        "src": "https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno",
        "sizes": "192x192",
        "type": "image/png",
        "purpose": "any maskable"
      },
      {
        "src": "https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno",
        "sizes": "512x512",
        "type": "image/png",
        "purpose": "any maskable"
      }
    ]
  }'>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x pan-y;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background-color: #00454f; /* Tema Latar Utama */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background-color: #00454f;
      touch-action: pan-x pan-y;
    }

    #loader {
      position: fixed;
      inset: 0;
      background-color: #00454f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .brand-logo {
      width: 82px;
      height: 82px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    .loader-text {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #e2e8f0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loader">
    <!-- Pratinjau logo saat aplikasi sedang memuat -->
    <img 
      class="brand-logo" 
      src="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno" 
      alt="Logo Velocity Kasir"
      onerror="this.style.display='none'"
    />
    <div class="spinner"></div>
    <div class="loader-text">Memuat Velocity Kasir...</div>
  </div>

  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxKlUnTTVgB98_33wBQpX6oHPpQOio9CFo42kDY19sUK3bMCU6R0N6kCmoWizeipeyQ/exec" 
    allow="camera; microphone; geolocation; fullscreen; payment; clipboard-read; clipboard-write"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(() => loader.remove(), 400);
      }
    }

    // Fallback otomatis loader jika koneksi lambat
    setTimeout(hideLoader, 6000);

    // 1. Blokir Pinch-to-Zoom (Sentuhan lebih dari 1 jari)
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // 2. Blokir Gestur Skala Bawaan iOS Safari & Chrome Touch
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function (e) {
      e.preventDefault();
    });

    // 3. Blokir Double-Tap Zoom (Ketukan ganda cepat)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    // 4. Blokir Ctrl + Scroll Wheel (Zoom via mouse/trackpad laptop)
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey) {
        e.preventDefault();
      }
    }, { passive: false });

    // Registrasi Service Worker PWA (jika sw.js tersedia di server)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Velocity Kasir Aktif:', reg.scope))
          .catch(err => console.log('SW registration note:', err.message));
      });
    }
  </script>
</body>
</html>

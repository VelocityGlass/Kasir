<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Kunci viewport: Skala tetap 1.0, minimum 1.0, maksimum 1.0, user-scalable=no -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>Velocity Kasir</title>

  <!-- 
    Ikon adaptif dengan inner padding & safe-area:
    Dibuat dengan format SVG Data-URI agar memiliki margin/padding di sekeliling logo 
    sehingga tidak terpotong saat dijadikan squircle/lingkaran oleh Android maupun iOS.
  -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%23ffffff'/%3E%3Cimage href='https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno' x='46' y='46' width='420' height='420' preserveAspectRatio='xMidYMid meet'/%3E%3C/svg%3E">
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23ffffff'/%3E%3Cimage href='https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno' x='56' y='56' width='400' height='400' preserveAspectRatio='xMidYMid meet'/%3E%3C/svg%3E">

  <!-- Manifest Web dengan padding aman dan background netral putih untuk logo maskable -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Velocity%20Kasir%22%2C%22short_name%22%3A%22Velocity%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2300454f%22%2C%22theme_color%22%3A%22%2300454f%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20512%20512'%253E%253Crect%20width%3D'512'%20height%3D'512'%20fill%3D'%2523ffffff'%2F%253E%253Cimage%20href%3D'https%3A%2F%2Flh3.googleusercontent.com%2Fd%2F1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno'%20x%3D'64'%20y%3D'64'%20width%3D'384'%20height%3D'384'%20preserveAspectRatio%3D'xMidYMid%20meet'%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <meta name="theme-color" content="#00454f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Velocity Kasir">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      /* Mencegah gesture zoom bawaan browser */
      touch-action: pan-x pan-y;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed; /* Mencegah overscroll bounce */
      background-color: #00454f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background-color: #00454f;
      touch-action: pan-x pan-y;
    }

    /* Loading Screen Mewah & Rapi dengan warna #00454f */
    #loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #00454f 0%, #002d34 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 24px;
    }

    /* Kartu Logo dengan Padding & Border Halus agar tidak terpotong */
    .logo-container {
      width: 130px;
      height: 130px;
      background: #ffffff;
      border-radius: 28px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
      margin-bottom: 28px;
      animation: pulseIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .loader-logo {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Memastikan logo utuh tanpa terpotong */
      display: block;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    .loader-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #f8fafc;
      margin-bottom: 4px;
    }

    .loader-subtitle {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2px;
      color: #94a3b8;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulseIn {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- Layar Pembuka / Splash Screen yang Rapi & Proporsional -->
  <div id="loader">
    <div class="logo-container">
      <img 
        src="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno" 
        alt="Velocity Glass Logo" 
        class="loader-logo"
        onerror="this.parentElement.style.display='none'">
    </div>
    <div class="spinner"></div>
    <div class="loader-title">Velocity Kasir</div>
    <div class="loader-subtitle">Menyiapkan sistem transaksi...</div>
  </div>

  <!-- Iframe Aplikasi Google Apps Script -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxKlUnTTVgB98_33wBQpX6oHPpQOio9CFo42kDY19sUK3bMCU6R0N6kCmoWizeipeyQ/exec" 
    allow="camera; microphone; geolocation; fullscreen; payment; clipboard-read; clipboard-write"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(() => loader.remove(), 400);
      }
    }

    // Fallback loader jika jaringan lambat
    setTimeout(hideLoader, 6000);

    // 1. Blokir Pinch-to-Zoom (Sentuhan lebih dari 1 jari)
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // 2. Blokir Gestur Skala (iOS Safari & Chrome Touch)
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function (e) {
      e.preventDefault();
    });

    // 3. Blokir Double-Tap Zoom (Ketukan dua kali beruntun)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    // 4. Blokir Ctrl + Scroll Wheel (Zoom via mouse/trackpad)
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey) {
        e.preventDefault();
      }
    }, { passive: false });

    // Registrasi Service Worker PWA (jika file sw.js tersedia)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Velocity Kasir Aktif:', reg.scope))
          .catch(err => console.warn('SW Registrasi (opsional):', err));
      });
    }
  </script>
</body>
</html>

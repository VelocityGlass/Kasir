  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Velocity%20Kasir%22%2C%22short_name%22%3A%22Velocity%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Flh3.googleusercontent.com%2Fd%2F1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%2C%7B%22src%22%3A%22https%3A%2F%2Flh3.googleusercontent.com%2Fd%2F1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Velocity Kasir">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      /* Mencegah gesture zoom bawaan browser */
      touch-action: pan-x pan-y;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed; /* Mencegah overscroll bounce */
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background-color: #0f172a;
      touch-action: pan-x pan-y;
    }

    /* Loading Screen Animasi Halus */
    #loader {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loader-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      object-fit: contain;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    .loader-text {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #cbd5e1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Layar Pembuka / Loading dengan Logo Bisnis -->
  <div id="loader">
    <img 
      src="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno" 
      alt="Velocity Logo" 
      class="loader-logo"
      onerror="this.style.display='none'">
    <div class="spinner"></div>
    <div class="loader-text">Memuat Velocity Kasir...</div>
  </div>

  <!-- Iframe Aplikasi Google Apps Script -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxKlUnTTVgB98_33wBQpX6oHPpQOio9CFo42kDY19sUK3bMCU6R0N6kCmoWizeipeyQ/exec" 
    allow="camera; microphone; geolocation; fullscreen; payment; clipboard-read; clipboard-write"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(() => loader.remove(), 400);
      }
    }

    // Fallback loader jika jaringan lambat
    setTimeout(hideLoader, 6000);

    // 1. Blokir Pinch-to-Zoom (Sentuhan lebih dari 1 jari)
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // 2. Blokir Gestur Skala (iOS Safari & Chrome Touch)
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function (e) {
      e.preventDefault();
    });

    // 3. Blokir Double-Tap Zoom (Ketukan dua kali beruntun)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    // 4. Blokir Ctrl + Scroll Wheel (Zoom via mouse/trackpad)
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey) {
        e.preventDefault();
      }
    }, { passive: false });

    // Registrasi Service Worker PWA (jika file sw.js tersedia)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Velocity Kasir Aktif:', reg.scope))
          .catch(err => console.warn('SW Registrasi (opsional):', err));
      });
    }
  </script>
</body>
</html>

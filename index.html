<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart WebApp</title>
  <meta name="description" content="Aplikasi Google Apps Script PWA">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GAS WebApp">

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Favicon & Icon dari Google Drive ID: 1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">

  <!-- Manifest JSON PWA -->
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .iframe-app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 10;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden select-none bg-slate-900">

  <!-- Banner Notifikasi Install PWA (Akan muncul otomatis saat siap diinstal) -->
  <div id="pwa-install-bar" class="hidden z-50 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-700/80 px-4 py-2.5 flex items-center justify-between transition-all duration-300">
    <div class="flex items-center gap-3">
      <img src="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno" alt="Logo" class="w-8 h-8 rounded-lg shadow-md border border-slate-700 object-cover" onerror="this.src='https://placehold.co/192x192/2563eb/ffffff?text=App'">
      <div>
        <h1 class="text-sm font-semibold text-slate-100 leading-tight">Smart WebApp</h1>
        <p class="text-xs text-slate-400">Pasang aplikasi ini di perangkat Anda</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-install" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-xs font-semibold py-1.5 px-3.5 rounded-full shadow-lg transition">
        <i class="bi bi-download"></i>
        <span>Install</span>
      </button>
      <button id="btn-close-banner" class="text-slate-400 hover:text-slate-200 p-1 rounded-full hover:bg-slate-800 transition">
        <i class="bi bi-x text-lg"></i>
      </button>
    </div>
  </div>

  <!-- Splash Screen Loading saat pertama dibuka -->
  <div id="splash-loader" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-900 text-white transition-opacity duration-500">
    <div class="relative flex items-center justify-center mb-4">
      <div class="w-20 h-20 rounded-2xl p-1 bg-gradient-to-tr from-blue-600 to-indigo-500 shadow-2xl flex items-center justify-center">
        <img src="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno" class="w-full h-full object-cover rounded-xl" alt="Icon" onerror="this.src='https://placehold.co/192x192/2563eb/ffffff?text=GAS'">
      </div>
      <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-emerald-500 border-2 border-slate-900 rounded-full flex items-center justify-center">
        <i class="bi bi-lightning-charge-fill text-[11px] text-white"></i>
      </div>
    </div>
    <p class="text-sm font-medium text-slate-200 tracking-wide">Membuka Aplikasi...</p>
    
    <div class="w-44 h-1.5 bg-slate-800 rounded-full mt-5 overflow-hidden">
      <div class="h-full bg-blue-500 rounded-full animate-pulse w-2/3"></div>
    </div>
  </div>

  <!-- Target WebApp Google Apps Script Anda -->
  <iframe 
    id="gas-app-frame" 
    class="iframe-app"
    src="https://script.google.com/macros/s/AKfycbzSMI5Hm8ttuevzpHjoYFCTm5eMqLBQiKqsPNY_4sko6sG6caBXGQ85GgNGXhs8Rbj8/exec"
    allow="geolocation; microphone; camera; midi; vr; accelerometer; gyroscope; payment; ambient-light-sensor; encrypted-media; usb; clipboard-read; clipboard-write;"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads"
    onload="hideSplashScreen()">
  </iframe>

  <script>
    // 1. Registrasi Service Worker PWA (Aman untuk HTTP/HTTPS & Preview Canvas)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const isSupportedProtocol = window.location.protocol === 'https:' || window.location.protocol === 'http:';
        if (isSupportedProtocol) {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('PWA Service Worker aktif:', reg.scope))
            .catch(err => console.warn('PWA Service Worker dilewati:', err));
        }
      });
    }

    // 2. Tombol & Event Instalasi Chrome PWA
    let deferredPrompt = null;
    const installBar = document.getElementById('pwa-install-bar');
    const installBtn = document.getElementById('btn-install');
    const closeBtn = document.getElementById('btn-close-banner');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBar.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) {
        // Panduan jika browser belum memicu event otomatis
        const hint = document.createElement('div');
        hint.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl z-50';
        hint.innerHTML = '<i class="bi bi-info-circle me-1"></i> Klik menu titik tiga (⋮) di Chrome &rarr; pilih <b>"Instal aplikasi"</b>';
        document.body.appendChild(hint);
        setTimeout(() => hint.remove(), 4000);
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log('Hasil respon user:', outcome);
      deferredPrompt = null;
      installBar.classList.add('hidden');
    });

    closeBtn.addEventListener('click', () => {
      installBar.classList.add('hidden');
    });

    // 3. Menghilangkan Splash Loader saat WebApp GAS selesai dimuat
    function hideSplashScreen() {
      const loader = document.getElementById('splash-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500);
      }
    }

    // Fallback otomatis jika koneksi lambat
    setTimeout(hideSplashScreen, 3500);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Saya</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4285f4">
    <style>
        body, html {
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; /* Mencegah scroll ganda */
        }
        iframe {
            width: 100%; 
            height: 100%; 
            border: none;
        }
    </style>
</head>
<body>
    <!-- Ini akan menampilkan web Google Apps Script kamu -->
    <iframe src="https://script.google.com/macros/s/AKfycbzSMI5Hm8ttuevzpHjoYFCTm5eMqLBQiKqsPNY_4sko6sG6caBXGQ85GgNGXhs8Rbj8/exec"></iframe>

    <script>
        // Mendaftarkan Service Worker (Syarat wajib agar bisa di-install)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker berhasil didaftarkan!'))
            .catch(err => console.log('Service Worker gagal:', err));
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart WebApp</title>

  <!-- Meta untuk Fullscreen & Mobile Standalone -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SmartApp">

  <!-- Adaptive Theme Color (Terang / Gelap agar status bar tidak tabrakan warna) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">

  <!-- Favicon & Touch Icon -->
  <link rel="icon" type="image/png" id="dynamic-favicon" href="https://lh3.googleusercontent.com/d/1WQt7gNQoMTc_nsGCWRh-0y42JPvig_Pd">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1WQt7gNQoMTc_nsGCWRh-0y42JPvig_Pd">

  <!-- Tailwind CSS & Bootstrap Icons untuk UI interaktif jika diperlukan -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #0f172a;
        color: #f8fafc;
      }
    }
    /* Frame utama Google Apps Script */
    #gas-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      transition: opacity 0.3s ease-in-out;
    }
    /* Loading overlay */
    #app-loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(8px);
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    /* Install Banner Floating Bottom */
    #install-banner {
      display: none;
      animation: slideUp 0.3s ease-out forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col relative w-full h-full">

  <!-- Screen Loading Animasi Halus -->
  <div id="app-loader" class="bg-white/80 dark:bg-slate-900/80">
    <div class="relative flex items-center justify-center mb-4">
      <img 
        src="https://lh3.googleusercontent.com/d/1WQt7gNQoMTc_nsGCWRh-0y42JPvig_Pd" 
        alt="Logo" 
        class="w-16 h-16 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-700 object-cover"
        onerror="this.src='https://placehold.co/100x100/3b82f6/ffffff?text=App';"
      >
      <div class="absolute -inset-1 rounded-2xl border-2 border-blue-500 animate-ping opacity-25"></div>
    </div>
    <div class="flex items-center space-x-2">
      <div class="w-2.5 h-2.5 bg-blue-600 rounded-full animate-bounce" style="animation-delay: 0s"></div>
      <div class="w-2.5 h-2.5 bg-blue-600 rounded-full animate-bounce" style="animation-delay: 0.15s"></div>
      <div class="w-2.5 h-2.5 bg-blue-600 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
    </div>
    <span class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-3 tracking-wide">Memuat Aplikasi...</span>
  </div>

  <!-- Banner Tombol Install (Muncul otomatis jika belum terinstal) -->
  <div id="install-banner" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-white/95 dark:bg-slate-800/95 backdrop-blur-md p-4 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 z-40 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <img src="https://lh3.googleusercontent.com/d/1WQt7gNQoMTc_nsGCWRh-0y42JPvig_Pd" class="w-10 h-10 rounded-xl shadow-sm object-cover" onerror="this.src='https://placehold.co/80x80/3b82f6/ffffff?text=App';">
      <div>
        <h4 class="font-semibold text-sm leading-tight text-slate-900 dark:text-white">Install WebApp</h4>
        <p class="text-xs text-slate-500 dark:text-slate-400">Jalankan fullscreen tanpa browser bar</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-close-banner" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 px-2 py-1.5 rounded-lg">Nanti</button>
      <button id="btn-install" class="text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl shadow-sm transition active:scale-95 flex items-center gap-1.5">
        <i class="bi bi-download"></i> Pasang
      </button>
    </div>
  </div>

  <!-- WebApp Frame Google Apps Script -->
  <iframe 
    id="gas-frame" 
    src="https://script.google.com/macros/s/AKfycbxu2Wy_9pVuM2iWZFAbzIYZU3M8KlX4d3XTtuWjMWE97QRNh_jn6EHPl8hPOoB6DeU-/exec"
    allow="geolocation; microphone; camera; midi; encrypted-media; clipboard-read; clipboard-write; fullscreen"
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-downloads"
    loading="eager"
  ></iframe>

  <!-- Script PWA & Manajemen Instalasi -->
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxu2Wy_9pVuM2iWZFAbzIYZU3M8KlX4d3XTtuWjMWE97QRNh_jn6EHPl8hPOoB6DeU-/exec";
    const ICON_DIRECT_URL = "https://lh3.googleusercontent.com/d/1WQt7gNQoMTc_nsGCWRh-0y42JPvig_Pd";

    const frame = document.getElementById('gas-frame');
    const loader = document.getElementById('app-loader');
    const installBanner = document.getElementById('install-banner');
    const btnInstall = document.getElementById('btn-install');
    const btnCloseBanner = document.getElementById('btn-close-banner');

    let deferredPrompt = null;

    // Menghilangkan loading ketika frame selesai dimuat
    frame.addEventListener('load', () => {
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.visibility = 'hidden';
        }, 400);
      }, 500);
    });

    // Fallback jika iframe lambat merespons (maksimal 6 detik loading)
    setTimeout(() => {
      if (loader.style.visibility !== 'hidden') {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.visibility = 'hidden'; }, 400);
      }
    }, 6000);

    // Membuat file manifest.json secara dinamis di memori browser
    const manifestJson = {
      name: "Smart WebApp GAS",
      short_name: "SmartApp",
      description: "Aplikasi Fullscreen Google Apps Script",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#f8fafc",
      icons: [
        {
          src: ICON_DIRECT_URL,
          sizes: "192x192",
          type: "image/png",
          purpose: "any maskable"
        },
        {
          src: ICON_DIRECT_URL,
          sizes: "512x512",
          type: "image/png",
          purpose: "any maskable"
        }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifestJson)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const linkManifest = document.createElement('link');
    linkManifest.rel = 'manifest';
    linkManifest.href = manifestUrl;
    document.head.appendChild(linkManifest);

    // Deteksi apakah sedang dibuka dalam mode standalone (terinstal di HP)
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) {
        installBanner.style.display = 'flex';
      }
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBanner.style.display = 'none';
        }
        deferredPrompt = null;
      } else {
        // Panduan jika browser iOS Safari atau Chrome versi lain
        alert("Untuk memasang di Layar Utama:\n1. Buka menu titik tiga browser (atau tombol Share di iPhone)\n2. Pilih 'Tambahkan ke Layar Utama' / 'Install App'");
      }
    });

    btnCloseBanner.addEventListener('click', () => {
      installBanner.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      installBanner.style.display = 'none';
      deferredPrompt = null;
    });

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'gas-pwa-cache-v1';
        self.addEventListener('install', (e) => {
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener('fetch', (e) => {
          // Pass-through fetch
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Note:', err));
    }
  </script>
</body>
</html>

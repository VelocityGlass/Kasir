<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Desktop WebApp</title>
  
  <!-- Manifest PWA untuk instalasi di Chrome -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00454f">
  
  <!-- Icon link (ID Google Drive Anda) -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Uac4sUkGDifGEB1vD4mCB_r1dp4wftno">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #00454f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #00454f;
    }
    
    /* Overlay penutup layar penuh murni berwarna #00454f tanpa icon */
    #preloader {
      position: fixed;
      inset: 0;
      background-color: #00454f;
      z-index: 99999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      pointer-events: all;
    }

    .hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>

  <!-- Layar penutup mulus tanpa icon mengganggu -->
  <div id="preloader"></div>

  <!-- 
    Iframe dengan izin lengkap: camera, microphone, geolocation, fullscreen, dll
  -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxu2Wy_9pVuM2iWZFAbzIYZU3M8KlX4d3XTtuWjMWE97QRNh_jn6EHPl8hPOoB6DeU-/exec"
    allow="camera; microphone; geolocation; fullscreen; display-capture; clipboard-read; clipboard-write; web-share"
    allowfullscreen>
  </iframe>

  <script>
    const preloader = document.getElementById('preloader');

    function revealApp() {
      if (!preloader.classList.contains('hidden')) {
        preloader.classList.add('hidden');
      }
    }

    // Menunggu iframe GAS selesai loading internal agar transisi mulus
    const frame = document.getElementById('app-frame');
    frame.addEventListener('load', () => {
      setTimeout(revealApp, 2000);
    });

    // Fallback pengaman koneksi
    setTimeout(revealApp, 4000);

    // Menerima sinyal bila internal GAS mengirim status ready
    window.addEventListener('message', (event) => {
      if (event.data === 'app-ready' || (event.data && event.data.type === 'READY')) {
        revealApp();
      }
    });

    // Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker terdaftar:', reg.scope))
          .catch(err => console.log('Gagal daftar SW:', err));
      });
    }
  </script>
</body>
</html>
